events {}

http {
    # Preserve the original external scheme supplied by the host nginx that
    # terminates TLS. Falling back to this container's scheme keeps direct
    # local access working as expected.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    # Cloudflare provides the per-client edge rate limit. These origin-side
    # limits are deliberately global per environment because the container
    # receives traffic through the host nginx reverse proxy.
    limit_req_zone $server_name zone=server_rate:10m rate=200r/s;
    limit_conn_zone $server_name zone=server_conn:10m;

    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_max_body_size 6m;

    server {
        listen 80;
        server_name staging.shopnest.co.il;

        auth_basic "ShopNest STAGING";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=server_rate burst=400 nodelay;
        limit_req_status 429;
        limit_conn server_conn 200;
        limit_conn_status 429;

        location / {
            proxy_pass http://web-staging:3000;
            proxy_http_version 1.1;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
