events {}

http {
    # Preserve the original external scheme supplied by the host nginx that
    # terminates TLS. Falling back to this container's scheme keeps direct
    # local access working as expected.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 80;

        auth_basic "ShopNest DEV";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://web-dev:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
