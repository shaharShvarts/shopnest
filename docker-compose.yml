version: "3.8"

services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_NAME: shopnest
      SHOPNEST_UPLOADS_DIR: /app/uploads
      SHOPNEST_PASSWORD_RESET_DEV_CAPTURE: ${SHOPNEST_PASSWORD_RESET_DEV_CAPTURE:-}
    depends_on:
      - db
    volumes:
      - shopnest_uploads:/app/uploads

  db:
    image: postgres:17.0
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web

volumes:
  pgdata:
  shopnest_uploads:
