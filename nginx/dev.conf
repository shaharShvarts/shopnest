# Install in HOST Nginx conf.d after issuing certificates.
server {
    listen 80;
    server_name dev.shopnest.co.il;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://dev.shopnest.co.il$request_uri; }
}
server {
    listen 443 ssl;
    server_name dev.shopnest.co.il;
    ssl_certificate /etc/letsencrypt/live/dev.shopnest.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.shopnest.co.il/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host dev.shopnest.co.il;
        proxy_set_header X-Forwarded-Host dev.shopnest.co.il;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
